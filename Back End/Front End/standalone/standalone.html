<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kost Manager - Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="https://unpkg.com/react-hot-toast@2.4.1/dist/index.umd.js"></script>
    <script src="https://unpkg.com/lucide-react@0.294.0/dist/umd/lucide-react.js"></script>
    <script src="https://unpkg.com/react-hook-form@7.48.2/dist/index.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;
        const { BrowserRouter, Routes, Route, Navigate, useNavigate } = ReactRouterDOM;
        const { Toaster } = ReactHotToast;
        const { useForm } = ReactHookForm;
        const { Eye, EyeOff, User, Lock, Building2, Users, Shield, CreditCard, Home, AlertTriangle, Plus, CheckCircle, Clock, XCircle, MessageSquare, ArrowLeft, Mail, Phone, Key, Calendar, DollarSign } = LucideReact;

        // Types
        const UserType = {
            id: Number,
            name: String,
            email: String,
            role: String,
            phone: String,
            avatar: String,
            created_at: String,
            updated_at: String
        };

        // Auth Context
        const AuthContext = createContext();

        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            const login = async (email, password, role) => {
                setIsLoading(true);
                // Simulate API call
                setTimeout(() => {
                    const mockUser = {
                        id: 1,
                        name: role === 'admin' ? 'Admin User' : 'Tenant User',
                        email: email,
                        role: role,
                        phone: '081234567890',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    setUser(mockUser);
                    localStorage.setItem('user', JSON.stringify(mockUser));
                    setIsLoading(false);
                }, 1000);
            };

            const logout = () => {
                setUser(null);
                localStorage.removeItem('user');
            };

            useEffect(() => {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }
            }, []);

            return (
                <AuthContext.Provider value={{ user, login, logout, isLoading }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const useAuth = () => {
            const context = useContext(AuthContext);
            if (!context) {
                throw new Error('useAuth must be used within AuthProvider');
            }
            return context;
        };

        // Protected Route Component
        const ProtectedRoute = ({ children, requiredRole }) => {
            const { user, isLoading } = useAuth();
            const navigate = useNavigate();

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="animate-spin rounded-full h-32 w-32 border-b-2 border-blue-600"></div>
                    </div>
                );
            }

            if (!user) {
                return <Navigate to="/login" replace />;
            }

            if (requiredRole && user.role !== requiredRole) {
                return <Navigate to="/unauthorized" replace />;
            }

            return children;
        };

        // Login Form Component
        const LoginForm = ({ onSwitchToSignup }) => {
            const [showPassword, setShowPassword] = useState(false);
            const [selectedRole, setSelectedRole] = useState('tenant');
            const { login, isLoading } = useAuth();
            const navigate = useNavigate();

            const { register, handleSubmit, formState: { errors } } = useForm();

            const onSubmit = async (data) => {
                try {
                    await login(data.email, data.password, selectedRole);
                    navigate(selectedRole === 'admin' ? '/admin' : '/tenant');
                } catch (error) {
                    console.error('Login error:', error);
                }
            };

            return (
                <div className="w-full max-w-md mx-auto" data-aos="fade-up">
                    <div className="bg-white rounded-2xl shadow-xl p-8">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                                <Building2 className="w-8 h-8 text-blue-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Selamat Datang</h2>
                            <p className="text-gray-600">Masuk ke akun Anda</p>
                        </div>

                        {/* Role Selection */}
                        <div className="mb-6">
                            <label className="block text-sm font-medium text-gray-700 mb-3">
                                Masuk sebagai:
                            </label>
                            <div className="grid grid-cols-2 gap-3">
                                <button
                                    type="button"
                                    onClick={() => setSelectedRole('tenant')}
                                    className={`p-3 rounded-lg border-2 transition-all ${
                                        selectedRole === 'tenant'
                                            ? 'border-blue-500 bg-blue-50 text-blue-700'
                                            : 'border-gray-200 text-gray-600 hover:border-gray-300'
                                    }`}
                                >
                                    <User className="w-5 h-5 mx-auto mb-1" />
                                    <span className="text-sm font-medium">Penyewa</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setSelectedRole('admin')}
                                    className={`p-3 rounded-lg border-2 transition-all ${
                                        selectedRole === 'admin'
                                            ? 'border-blue-500 bg-blue-50 text-blue-700'
                                            : 'border-gray-200 text-gray-600 hover:border-gray-300'
                                    }`}
                                >
                                    <Building2 className="w-5 h-5 mx-auto mb-1" />
                                    <span className="text-sm font-medium">Pemilik</span>
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit(onSubmit)} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Email
                                </label>
                                <div className="relative">
                                    <input
                                        type="email"
                                        {...register('email', { required: 'Email wajib diisi' })}
                                        className="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan email Anda"
                                    />
                                    <User className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                </div>
                                {errors.email && (
                                    <p className="mt-1 text-sm text-red-600">{errors.email.message}</p>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Password
                                </label>
                                <div className="relative">
                                    <input
                                        type={showPassword ? 'text' : 'password'}
                                        {...register('password', { required: 'Password wajib diisi' })}
                                        className="w-full px-4 py-3 pl-12 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan password Anda"
                                    />
                                    <Lock className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                    <button
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                    >
                                        {showPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                                    </button>
                                </div>
                                {errors.password && (
                                    <p className="mt-1 text-sm text-red-600">{errors.password.message}</p>
                                )}
                            </div>

                            <button
                                type="submit"
                                disabled={isLoading}
                                className="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {isLoading ? 'Memproses...' : 'Masuk'}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <p className="text-sm text-gray-600">
                                Belum punya akun?{' '}
                                <button
                                    onClick={onSwitchToSignup}
                                    className="text-blue-600 hover:text-blue-700 font-medium"
                                >
                                    Daftar sebagai penyewa
                                </button>
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // Signup Form Component
        const SignupForm = ({ onSwitchToLogin }) => {
            const [showPassword, setShowPassword] = useState(false);
            const [showConfirmPassword, setShowConfirmPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);

            const { register, handleSubmit, watch, formState: { errors } } = useForm();
            const password = watch('password');

            const onSubmit = async (data) => {
                setIsLoading(true);
                // Simulate API call
                setTimeout(() => {
                    setIsLoading(false);
                    onSwitchToLogin();
                }, 1000);
            };

            return (
                <div className="w-full max-w-md mx-auto" data-aos="fade-up">
                    <div className="bg-white rounded-2xl shadow-xl p-8">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                                <User className="w-8 h-8 text-blue-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Daftar Sebagai Penyewa</h2>
                            <p className="text-gray-600">Buat akun baru untuk menyewa kost</p>
                        </div>

                        <form onSubmit={handleSubmit(onSubmit)} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Nama Lengkap
                                </label>
                                <div className="relative">
                                    <input
                                        type="text"
                                        {...register('name', { required: 'Nama wajib diisi' })}
                                        className="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan nama lengkap"
                                    />
                                    <User className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                </div>
                                {errors.name && (
                                    <p className="mt-1 text-sm text-red-600">{errors.name.message}</p>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Email
                                </label>
                                <div className="relative">
                                    <input
                                        type="email"
                                        {...register('email', { 
                                            required: 'Email wajib diisi',
                                            pattern: {
                                                value: /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i,
                                                message: 'Format email tidak valid'
                                            }
                                        })}
                                        className="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan email Anda"
                                    />
                                    <Mail className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                </div>
                                {errors.email && (
                                    <p className="mt-1 text-sm text-red-600">{errors.email.message}</p>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Nomor Telepon
                                </label>
                                <div className="relative">
                                    <input
                                        type="tel"
                                        {...register('phone', { 
                                            required: 'Nomor telepon wajib diisi',
                                            pattern: {
                                                value: /^[0-9+\-\s()]+$/,
                                                message: 'Format nomor telepon tidak valid'
                                            }
                                        })}
                                        className="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan nomor telepon"
                                    />
                                    <Phone className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                </div>
                                {errors.phone && (
                                    <p className="mt-1 text-sm text-red-600">{errors.phone.message}</p>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Kode Akses dari Pemilik
                                </label>
                                <div className="relative">
                                    <input
                                        type="text"
                                        {...register('accessCode', { required: 'Kode akses wajib diisi' })}
                                        className="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan kode akses dari pemilik kost"
                                    />
                                    <Key className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                </div>
                                {errors.accessCode && (
                                    <p className="mt-1 text-sm text-red-600">{errors.accessCode.message}</p>
                                )}
                                <p className="mt-1 text-xs text-gray-500">
                                    Minta kode akses kepada pemilik kost untuk mendaftar
                                </p>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Password
                                </label>
                                <div className="relative">
                                    <input
                                        type={showPassword ? 'text' : 'password'}
                                        {...register('password', { 
                                            required: 'Password wajib diisi',
                                            minLength: {
                                                value: 6,
                                                message: 'Password minimal 6 karakter'
                                            }
                                        })}
                                        className="w-full px-4 py-3 pl-12 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Masukkan password"
                                    />
                                    <Lock className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                    <button
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                    >
                                        {showPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                                    </button>
                                </div>
                                {errors.password && (
                                    <p className="mt-1 text-sm text-red-600">{errors.password.message}</p>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Konfirmasi Password
                                </label>
                                <div className="relative">
                                    <input
                                        type={showConfirmPassword ? 'text' : 'password'}
                                        {...register('confirmPassword', { 
                                            required: 'Konfirmasi password wajib diisi',
                                            validate: value => value === password || 'Password tidak cocok'
                                        })}
                                        className="w-full px-4 py-3 pl-12 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        placeholder="Konfirmasi password"
                                    />
                                    <Lock className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                    <button
                                        type="button"
                                        onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                                        className="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                    >
                                        {showConfirmPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
                                    </button>
                                </div>
                                {errors.confirmPassword && (
                                    <p className="mt-1 text-sm text-red-600">{errors.confirmPassword.message}</p>
                                )}
                            </div>

                            <button
                                type="submit"
                                disabled={isLoading}
                                className="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {isLoading ? 'Memproses...' : 'Daftar'}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <p className="text-sm text-gray-600">
                                Sudah punya akun?{' '}
                                <button
                                    onClick={onSwitchToLogin}
                                    className="text-blue-600 hover:text-blue-700 font-medium"
                                >
                                    Masuk di sini
                                </button>
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // Login Page Component
        const LoginPage = () => {
            const [isLogin, setIsLogin] = useState(true);

            useEffect(() => {
                // Initialize AOS
                if (typeof AOS !== 'undefined') {
                    AOS.init({
                        duration: 800,
                        easing: 'ease-in-out',
                        once: true,
                    });
                }
            }, []);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-gray-50">
                    {/* Header */}
                    <header className="relative overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-r from-blue-600 to-blue-800"></div>
                        <div className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                            <div className="text-center" data-aos="fade-down">
                                <h1 className="text-4xl md:text-6xl font-bold text-white mb-4">
                                    E-Kost Manager
                                </h1>
                                <p className="text-xl text-blue-100 max-w-2xl mx-auto">
                                    Kelola kost dengan mudah dan efisien. Platform terintegrasi untuk pemilik dan penyewa kost.
                                </p>
                            </div>
                        </div>
                    </header>

                    {/* Features Section */}
                    <section className="py-16 bg-white">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-12" data-aos="fade-up">
                                <h2 className="text-3xl font-bold text-gray-900 mb-4">
                                    Mengapa Memilih E-Kost Manager?
                                </h2>
                                <p className="text-lg text-gray-600 max-w-2xl mx-auto">
                                    Solusi lengkap untuk mengelola kost dengan fitur-fitur modern dan user-friendly
                                </p>
                            </div>

                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="text-center" data-aos="fade-up" data-aos-delay="100">
                                    <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                                        <Building2 className="w-8 h-8 text-blue-600" />
                                    </div>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-2">
                                        Manajemen Kost
                                    </h3>
                                    <p className="text-gray-600">
                                        Kelola data kost, kamar, dan fasilitas dengan mudah melalui dashboard admin
                                    </p>
                                </div>

                                <div className="text-center" data-aos="fade-up" data-aos-delay="200">
                                    <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                                        <Users className="w-8 h-8 text-blue-600" />
                                    </div>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-2">
                                        Dashboard Penyewa
                                    </h3>
                                    <p className="text-gray-600">
                                        Penyewa dapat melihat informasi kost, melakukan pembayaran, dan melaporkan masalah
                                    </p>
                                </div>

                                <div className="text-center" data-aos="fade-up" data-aos-delay="300">
                                    <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                                        <CreditCard className="w-8 h-8 text-blue-600" />
                                    </div>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-2">
                                        Pembayaran Digital
                                    </h3>
                                    <p className="text-gray-600">
                                        Sistem pembayaran terintegrasi untuk memudahkan transaksi sewa kost
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Auth Section */}
                    <section className="py-16 bg-gray-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="max-w-md mx-auto">
                                {isLogin ? (
                                    <LoginForm onSwitchToSignup={() => setIsLogin(false)} />
                                ) : (
                                    <SignupForm onSwitchToLogin={() => setIsLogin(true)} />
                                )}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-white py-8">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <p className="text-gray-400">
                                © 2024 E-Kost Manager. Dibuat dengan ❤️ untuk kemudahan mengelola kost.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        // Admin Dashboard Component
        const AdminDashboard = () => {
            const { user, logout } = useAuth();
            const [activeTab, setActiveTab] = useState('overview');

            useEffect(() => {
                if (typeof AOS !== 'undefined') {
                    AOS.init({
                        duration: 600,
                        easing: 'ease-in-out',
                        once: true,
                    });
                }
            }, []);

            const stats = [
                { name: 'Total Kost', value: '12', icon: Building2, color: 'bg-blue-500' },
                { name: 'Total Penyewa', value: '45', icon: Users, color: 'bg-green-500' },
                { name: 'Pembayaran Bulan Ini', value: 'Rp 15.2M', icon: CreditCard, color: 'bg-yellow-500' },
                { name: 'Pengaduan Aktif', value: '3', icon: AlertTriangle, color: 'bg-red-500' },
            ];

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <div className="flex items-center">
                                    <Building2 className="w-8 h-8 text-blue-600 mr-3" />
                                    <h1 className="text-2xl font-bold text-gray-900">E-Kost Manager</h1>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <div className="text-right">
                                        <p className="text-sm font-medium text-gray-900">{user?.name}</p>
                                        <p className="text-xs text-gray-500">Pemilik Kost</p>
                                    </div>
                                    <button
                                        onClick={logout}
                                        className="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Stats Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                            {stats.map((stat, index) => (
                                <div
                                    key={stat.name}
                                    className="bg-white rounded-xl shadow-sm p-6"
                                    data-aos="fade-up"
                                    data-aos-delay={index * 100}
                                >
                                    <div className="flex items-center">
                                        <div className={`p-3 rounded-lg ${stat.color}`}>
                                            <stat.icon className="w-6 h-6 text-white" />
                                        </div>
                                        <div className="ml-4">
                                            <p className="text-sm font-medium text-gray-600">{stat.name}</p>
                                            <p className="text-2xl font-bold text-gray-900">{stat.value}</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Dashboard Content */}
                        <div className="bg-white rounded-xl shadow-sm p-6">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Dashboard Admin</h2>
                            <p className="text-gray-600">
                                Selamat datang di dashboard admin E-Kost Manager. Di sini Anda dapat mengelola semua aspek kost Anda.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // Tenant Dashboard Component
        const TenantDashboard = () => {
            const { user, logout } = useAuth();

            useEffect(() => {
                if (typeof AOS !== 'undefined') {
                    AOS.init({
                        duration: 600,
                        easing: 'ease-in-out',
                        once: true,
                    });
                }
            }, []);

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <div className="flex items-center">
                                    <Home className="w-8 h-8 text-blue-600 mr-3" />
                                    <h1 className="text-2xl font-bold text-gray-900">E-Kost Manager</h1>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <div className="text-right">
                                        <p className="text-sm font-medium text-gray-900">{user?.name}</p>
                                        <p className="text-xs text-gray-500">Penyewa</p>
                                    </div>
                                    <button
                                        onClick={logout}
                                        className="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* My Kost Info */}
                        <div className="bg-white rounded-xl shadow-sm p-6 mb-8" data-aos="fade-up">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Informasi Kost Saya</h2>
                            <div className="grid md:grid-cols-2 gap-6">
                                <div>
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">Kost ABC</h3>
                                    <p className="text-gray-600 mb-2">Jl. Merdeka No. 123, Jakarta</p>
                                    <p className="text-sm text-gray-500">Kamar: A-101</p>
                                    <p className="text-sm text-gray-500">Pemilik: Budi Santoso</p>
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-sm text-gray-600">Sewa Bulanan:</span>
                                        <span className="text-lg font-semibold text-gray-900">Rp 1.500.000</span>
                                    </div>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-sm text-gray-600">Fasilitas:</span>
                                        <span className="text-sm text-gray-900">4 item</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-sm text-gray-600">Kontak Pemilik:</span>
                                        <span className="text-sm text-blue-600">081234567890</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Dashboard Content */}
                        <div className="bg-white rounded-xl shadow-sm p-6">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Dashboard Penyewa</h2>
                            <p className="text-gray-600">
                                Selamat datang di dashboard penyewa E-Kost Manager. Di sini Anda dapat melihat informasi kost, melakukan pembayaran, dan melaporkan masalah.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // Unauthorized Page Component
        const UnauthorizedPage = () => {
            const navigate = useNavigate();

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="max-w-md w-full text-center" data-aos="fade-up">
                        <div className="bg-white rounded-2xl shadow-xl p-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-4">
                                <Shield className="w-8 h-8 text-red-600" />
                            </div>
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">
                                Akses Ditolak
                            </h1>
                            <p className="text-gray-600 mb-6">
                                Anda tidak memiliki izin untuk mengakses halaman ini.
                            </p>
                            <button
                                onClick={() => navigate(-1)}
                                className="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all flex items-center justify-center"
                            >
                                <ArrowLeft className="w-4 h-4 mr-2" />
                                Kembali
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // App Routes Component
        const AppRoutes = () => {
            const { user } = useAuth();

            return (
                <Routes>
                    <Route path="/login" element={<LoginPage />} />
                    <Route path="/unauthorized" element={<UnauthorizedPage />} />
                    <Route
                        path="/admin"
                        element={
                            <ProtectedRoute requiredRole="admin">
                                <AdminDashboard />
                            </ProtectedRoute>
                        }
                    />
                    <Route
                        path="/tenant"
                        element={
                            <ProtectedRoute requiredRole="tenant">
                                <TenantDashboard />
                            </ProtectedRoute>
                        }
                    />
                    <Route
                        path="/"
                        element={
                            user ? (
                                <Navigate to={user.role === 'admin' ? '/admin' : '/tenant'} replace />
                            ) : (
                                <Navigate to="/login" replace />
                            )
                        }
                    />
                    <Route path="*" element={<Navigate to="/" replace />} />
                </Routes>
            );
        };

        // Main App Component
        const App = () => {
            return (
                <AuthProvider>
                    <BrowserRouter>
                        <div className="App">
                            <AppRoutes />
                            <Toaster
                                position="top-right"
                                toastOptions={{
                                    duration: 4000,
                                    style: {
                                        background: '#363636',
                                        color: '#fff',
                                    },
                                }}
                            />
                        </div>
                    </BrowserRouter>
                </AuthProvider>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
