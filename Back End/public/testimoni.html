<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Testimoni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">🗣️ Form Testimoni</h2>

    <form id="formTestimoni">
        <div class="mb-3">
            <input type="text" name="nama" class="form-control" placeholder="Nama" required>
        </div>
        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3">
            <textarea name="pesan" class="form-control" placeholder="Pesan" required></textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">Kirim</button>
    </form>

    <div id="hasil" class="mt-4"></div>
</div>

<script>
document.getElementById('formTestimoni').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
        nama: e.target.nama.value,
        email: e.target.email.value,
        pesan: e.target.pesan.value
    };

    const response = await fetch('http://127.0.0.1:8000/api/testimoni', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    if (response.ok) {
        document.getElementById('hasil').innerHTML = `
            <div class="alert alert-success">✅ Testimoni berhasil dikirim!</div>
        `;
        e.target.reset();
    } else {
        document.getElementById('hasil').innerHTML = `
            <div class="alert alert-danger">❌ Gagal mengirim testimoni.</div>
        `;
    }
});
</script>
</body>
</html>
